<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>ChromaSnap — Select Mode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Quicksand:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ===================================================
       ChromaSnap — same design system as app_strip.html
    =================================================== */
    :root {
      --bg:          #F5EFE6;
      --bg-dark:     #1C1410;
      --surface:     #FDFAF5;
      --surface-2:   #EDE6DA;
      --wood:        #8B6245;
      --wood-deep:   #4A3322;
      --amber:       #C9924F;
      --amber-soft:  rgba(201,146,79,0.14);
      --sakura:      #C09098;
      --sakura-soft: rgba(192,144,152,0.14);
      --matcha:      #7A9B82;
      --matcha-soft: rgba(122,155,130,0.14);
      --positive:    #C95A72;
      --negative:    #5A8A62;
      --text:        #2E2118;
      --text-2:      #7A6A5A;
      --text-3:      #A99888;
      --border:      rgba(139,98,69,0.12);
      --safe-top:    env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body { min-height: 100dvh; background: var(--bg); }
    body {
      font-family: 'Quicksand', 'Sarabun', sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ============ TOP BAR (static, light) ============ */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(var(--safe-top) + 14px) 20px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .app-brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'Shippori Mincho', serif;
      font-size: 0.98rem;
      color: var(--wood-deep);
      letter-spacing: 0.06em;
    }
    .brand-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--sakura);
    }
    .badge {
      font-family: 'Quicksand', sans-serif;
      font-size: 0.55rem;
      line-height: 1.5;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--sakura);
      border: 1px solid var(--sakura);
      opacity: 0.85;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .top-icon {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-2);
      font-size: 0.85rem;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
      transition: background 0.2s;
    }
    .top-icon:active { background: var(--border); }

    /* ============ CONTENT ============ */
    .content {
      flex: 1;
      padding: 30px 22px calc(var(--safe-bottom) + 30px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .page-head {
      text-align: center;
      margin-bottom: 26px;
    }
    .page-head h1 {
      font-family: 'Shippori Mincho', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .page-head p {
      font-size: 0.85rem;
      color: var(--text-3);
    }

    .mode-list {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .mode-card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--surface);
      border-radius: 18px;
      padding: 18px 16px;
      text-decoration: none;
      border: 1.5px solid var(--border);
      box-shadow: 0 2px 8px rgba(46,33,24,0.06);
      transition: all 0.18s;
    }
    .mode-card:active { background: var(--surface-2); transform: scale(0.98); }

    .mode-icon {
      width: 50px; height: 50px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .sakura-icon { background: var(--sakura-soft); color: var(--sakura); }
    .amber-icon  { background: var(--amber-soft);  color: var(--amber);  }
    .matcha-icon { background: var(--matcha-soft); color: var(--matcha); }

    .mode-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .mode-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
    }
    .mode-desc {
      font-size: 0.72rem;
      color: var(--text-3);
      line-height: 1.5;
    }
    .mode-arrow {
      color: var(--text-3);
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .back-row {
      margin-top: 26px;
    }
    .back-link {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-2);
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.04em;
    }
    .back-link:active { opacity: 0.6; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="app-brand">
      <div class="brand-dot"></div>
      ChromaSnap
      <span class="badge" data-i18n="badge_select">SELECT</span>
    </div>
    <a href="index.html" class="top-icon" title="Home"><i class="fa-solid fa-house"></i></a>
  </div>

  <div class="content">
    <div class="page-head">
      <h1 data-i18n="select_mode_title">Select Mode</h1>
      <p data-i18n="select_mode_desc">Choose a detection method</p>
    </div>

    <div class="mode-list">
      <a href="app_strip.html" class="mode-card">
        <div class="mode-icon sakura-icon"><i class="fa-solid fa-barcode"></i></div>
        <div class="mode-info">
          <span class="mode-title" data-i18n="mode_strip_title">Strip Detection</span>
          <span class="mode-desc" data-i18n="mode_strip_desc">DNA concentration &amp; membrane color read — fully offline</span>
        </div>
        <i class="fa-solid fa-chevron-right mode-arrow"></i>
      </a>

      <a href="app_color.html" class="mode-card">
        <div class="mode-icon amber-icon"><i class="fa-solid fa-vial"></i></div>
        <div class="mode-info">
          <span class="mode-title" data-i18n="mode_lamp_title">LAMP Color Detection</span>
          <span class="mode-desc" data-i18n="mode_lamp_desc">YOLO finds the tube, XGB predicts concentration</span>
        </div>
        <i class="fa-solid fa-chevron-right mode-arrow"></i>
      </a>

      <a href="history.html" class="mode-card">
        <div class="mode-icon matcha-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
        <div class="mode-info">
          <span class="mode-title" data-i18n="mode_history_title">History</span>
          <span class="mode-desc" data-i18n="mode_history_desc">View all previous scan results on this device</span>
        </div>
        <i class="fa-solid fa-chevron-right mode-arrow"></i>
      </a>
    </div>

    <div class="back-row">
      <a href="index.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> <span data-i18n="btn_back">Back</span>
      </a>
    </div>
  </div>

  <script src="translations.js"></script>
  <script>
    const currentLang = localStorage.getItem('cs_lang') || 'en';
    function T(key) {
      const dict = window.translations || {};
      return (dict[currentLang] && dict[currentLang][key])
          || (dict.en && dict.en[key])
          || key;
    }
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = T(el.dataset.i18nHtml); });
  </script>
</body>
</html>
