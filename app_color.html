<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>ChromaSnap — Color</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Quicksand:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ===================================================
       ChromaSnap Color App — Soft Eye-Comfort Redesign
       Warm oat tones, split layout, easy to read
    =================================================== */
    :root {
      /* Soft warm palette — easy on eyes */
      --bg:          #F5EFE6;       /* warm oat */
      --bg-dark:     #1C1410;       /* deep espresso for viewfinder */
      --surface:     #FDFAF5;       /* near-white warm */
      --surface-2:   #EDE6DA;       /* soft warm card */
      --wood:        #8B6245;       /* warm mid-brown */
      --wood-deep:   #4A3322;       /* dark brown */
      --amber:       #C9924F;       /* warm amber */
      --amber-soft:  rgba(201,146,79,0.14);
      --sakura:      #C09098;       /* dusty rose */
      --matcha:      #7A9B82;       /* sage green */
      --positive:    #C95A72;       /* deep rose */
      --negative:    #5A8A62;       /* sage */
      --text:        #2E2118;       /* warm espresso */
      --text-2:      #7A6A5A;       /* warm muted */
      --text-3:      #A99888;       /* lightest muted */
      --border:      rgba(139,98,69,0.12);
      --shadow:      rgba(46,33,24,0.10);
      --safe-top:    env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%; height: 100dvh;
      overflow: hidden;
      background: var(--bg-dark);
    }

    body {
      font-family: 'Quicksand', 'Sarabun', sans-serif;
      display: flex;
      flex-direction: column;
      color: var(--text);
    }

    /* ============ VIEWFINDER (top ~60%) ============ */
    .viewfinder {
      position: relative;
      flex: 1;
      overflow: hidden;
      background: var(--bg-dark);
      min-height: 0;
    }

    #previewImg {
      width: 100%; height: 100%;
      object-fit: contain;
      display: none;
      background: #0A0806;
    }

    /* Idle placeholder */
    .vf-idle {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .vf-idle-icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: rgba(201,146,79,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: rgba(201,146,79,0.7);
      border: 1.5px solid rgba(201,146,79,0.2);
    }
    .vf-idle p {
      color: rgba(245,239,230,0.45);
      font-size: 0.82rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-align: center;
      line-height: 1.7;
    }

    /* Scanning frame corners */
    .scan-frame {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .scan-frame::before, .scan-frame::after,
    .scan-frame span::before, .scan-frame span::after {
      content: '';
      position: absolute;
      width: 22px; height: 22px;
      border-style: solid;
      border-color: rgba(201,146,79,0.4);
    }
    .scan-frame::before  { top:56px;    left:18px;  border-width: 1.5px 0 0 1.5px; }
    .scan-frame::after   { top:56px;    right:18px; border-width: 1.5px 1.5px 0 0; }
    .scan-frame span::before { bottom:0; left:18px;  border-width: 0 0 1.5px 1.5px; }
    .scan-frame span::after  { bottom:0; right:18px; border-width: 0 1.5px 1.5px 0; }

    /* Top bar overlay on viewfinder */
    .top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(var(--safe-top) + 8px) 18px 10px;
      background: linear-gradient(to bottom, rgba(28,20,16,0.8) 0%, transparent 100%);
    }
    .app-brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'Shippori Mincho', serif;
      font-size: 0.95rem;
      color: rgba(245,239,230,0.88);
      letter-spacing: 0.06em;
    }
    .brand-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--amber);
      opacity: 0.9;
    }
    .badge {
      font-family: 'Quicksand', sans-serif;
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--amber);
      border: 1px solid rgba(201,146,79,0.4);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .top-icons { display: flex; gap: 8px; }
    .top-icon {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(245,239,230,0.08);
      border: 1px solid rgba(245,239,230,0.1);
      color: rgba(245,239,230,0.7);
      font-size: 0.85rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; text-decoration: none;
      transition: background 0.2s;
    }
    .top-icon:active { background: rgba(245,239,230,0.16); }

    /* Analyzing overlay */
    .overlay-analyze {
      position: absolute;
      inset: 0;
      background: rgba(28,20,16,0.72);
      backdrop-filter: blur(2px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 30;
    }
    .overlay-analyze.on { display: flex; }
    .spin-ring {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 2.5px solid rgba(201,146,79,0.18);
      border-top-color: var(--amber);
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .overlay-analyze p {
      font-size: 0.8rem;
      color: rgba(245,239,230,0.7);
      letter-spacing: 0.1em;
      font-weight: 500;
    }

    /* ============ BOTTOM PANEL (warm oat) ============ */
    .bottom-panel {
      background: var(--bg);
      padding: 18px 22px calc(var(--safe-bottom) + 18px);
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex-shrink: 0;
      border-top: 1px solid var(--border);
    }

    /* Pathogen row */
    .pathogen-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      row-gap: 6px;
    }
    .row-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--text-3);
      text-transform: uppercase;
      margin-right: 2px;
      white-space: nowrap;
    }
    .chip {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      cursor: pointer;
      transition: all 0.18s;
      letter-spacing: 0.02em;
    }
    .chip.active {
      background: var(--wood-deep);
      border-color: var(--wood-deep);
      color: rgba(245,239,230,0.95);
    }
    .chip:active { opacity: 0.75; }

    /* Today counter */
    .today-count {
      margin-left: auto;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-3);
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .today-count span {
      color: var(--amber);
      font-weight: 700;
      font-size: 0.85rem;
    }

    /* Capture row */
    .capture-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }
    .side-btn {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      color: var(--text-2);
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; text-decoration: none;
      transition: all 0.18s;
    }
    .side-btn:active { background: var(--surface); transform: scale(0.94); }

    .capture-btn {
      width: 68px; height: 68px;
      border-radius: 50%;
      background: var(--wood-deep);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow:
        0 4px 18px rgba(46,33,24,0.28),
        0 1px 0 rgba(245,230,200,0.15) inset;
      transition: transform 0.14s, box-shadow 0.14s;
    }
    .capture-btn:active {
      transform: scale(0.91);
      box-shadow: 0 2px 8px rgba(46,33,24,0.2);
    }
    .capture-btn i { font-size: 1.5rem; color: rgba(245,230,200,0.9); }
    #imgInput { display: none; }

    /* ============ RESULT SHEET ============ */
    .result-sheet {
      position: fixed;
      inset: 0 0 0 0;
      background: rgba(46,33,24,0.3);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .result-sheet.open {
      opacity: 1;
      pointer-events: auto;
    }
    .sheet-body {
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 0 22px calc(var(--safe-bottom) + 22px);
      width: 100%;
      max-height: 92dvh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .result-sheet.open .sheet-body {
      transform: translateY(0);
    }

    .handle {
      width: 36px; height: 4px;
      background: var(--surface-2);
      border-radius: 2px;
      margin: 14px auto 22px;
    }

    /* Result headline */
    .result-headline {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    .status-pill {
      padding: 7px 16px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .status-pill.positive {
      background: rgba(201,90,114,0.1);
      color: var(--positive);
    }
    .status-pill.negative {
      background: rgba(90,138,98,0.1);
      color: var(--negative);
    }
    .status-pill.unknown {
      background: var(--amber-soft);
      color: var(--amber);
    }
    .result-label {
      font-family: 'Shippori Mincho', serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
    }
    .result-sub {
      font-size: 0.75rem;
      color: var(--text-3);
      margin-top: 2px;
      font-weight: 500;
    }

    /* Detected color swatch */
    .color-swatch-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--surface-2);
      border-radius: 14px;
      margin-bottom: 14px;
    }
    .detected-swatch {
      width: 48px; height: 48px;
      border-radius: 12px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      border: 1px solid rgba(0,0,0,0.06);
    }
    .swatch-info .si-lbl {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 3px;
    }
    .swatch-info .si-val {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-2);
    }

    /* Metrics grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }
    .metric-card {
      background: var(--surface-2);
      border-radius: 14px;
      padding: 14px 16px;
    }
    .mc-lbl {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 5px;
    }
    .mc-val {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }
    .mc-unit {
      font-size: 0.7rem;
      color: var(--text-3);
      font-weight: 500;
      margin-top: 2px;
    }

    /* Result image thumb */
    .result-thumb {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 16px;
      display: none;
      background: var(--surface-2);
    }

    /* Actions */
    .sheet-actions {
      display: flex;
      gap: 10px;
    }
    .s-btn {
      flex: 1;
      height: 48px;
      border-radius: 14px;
      border: none;
      font-size: 0.88rem;
      font-weight: 600;
      font-family: 'Quicksand', sans-serif;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      transition: all 0.18s;
      letter-spacing: 0.02em;
    }
    .s-btn.primary {
      background: var(--wood-deep);
      color: rgba(245,230,200,0.95);
      box-shadow: 0 3px 12px rgba(46,33,24,0.2);
    }
    .s-btn.ghost {
      background: var(--surface-2);
      color: var(--text-2);
    }
    .s-btn:active { opacity: 0.78; transform: scale(0.97); }

    /* ============ TOAST ============ */
    .toast {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: var(--wood-deep);
      color: rgba(245,230,200,0.92);
      padding: 11px 20px;
      border-radius: 30px;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex; align-items: center; gap: 9px;
      z-index: 200;
      transition: transform 0.32s cubic-bezier(0.32,0.72,0,1);
      white-space: nowrap;
      box-shadow: 0 4px 18px rgba(0,0,0,0.28);
      letter-spacing: 0.02em;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast-undo {
      color: var(--amber);
      cursor: pointer;
      font-weight: 700;
      margin-left: 4px;
    }

    /* ============ SETTINGS SHEET ============ */
    .settings-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(46,33,24,0.3);
      backdrop-filter: blur(3px);
      z-index: 150;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .settings-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .settings-sheet {
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 0 22px calc(var(--safe-bottom) + 22px);
      width: 100%;
      transform: translateY(100%);
      transition: transform 0.38s cubic-bezier(0.32,0.72,0,1);
    }
    .settings-backdrop.open .settings-sheet {
      transform: translateY(0);
    }
    .settings-title {
      font-family: 'Shippori Mincho', serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      padding: 22px 0 14px;
      margin-bottom: 4px;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-top: 1px solid var(--border);
    }
    .setting-row label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
    }
    .setting-row small {
      display: block;
      font-size: 0.7rem;
      color: var(--text-3);
      margin-top: 1px;
    }
    .setting-row select {
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 0.82rem;
      color: var(--text);
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }
    .done-btn {
      width: 100%;
      height: 48px;
      margin-top: 18px;
      background: var(--wood-deep);
      color: rgba(245,230,200,0.95);
      border: none;
      border-radius: 14px;
      font-size: 0.92rem;
      font-weight: 700;
      font-family: 'Quicksand', sans-serif;
      cursor: pointer;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <!-- VIEWFINDER -->
  <div class="viewfinder">
    <img id="previewImg" alt="Captured">

    <!-- Idle placeholder -->
    <div class="vf-idle" id="idleHint">
      <div class="vf-idle-icon"><i class="fa-solid fa-flask"></i></div>
      <p>Point at LAMP tube<br>and press capture</p>
    </div>

    <!-- Corner frame -->
    <div class="scan-frame"><span></span></div>

    <!-- Top bar -->
    <div class="top-bar">
      <div class="app-brand">
        <div class="brand-dot"></div>
        ChromaSnap
        <span class="badge">COLOR</span>
      </div>
      <div class="top-icons">
        <a href="homepage.html" class="top-icon" title="Back"><i class="fa-solid fa-house"></i></a>
        <a href="history.html" class="top-icon"><i class="fa-solid fa-clock-rotate-left"></i></a>
        <button class="top-icon" id="settingsBtn"><i class="fa-solid fa-sliders"></i></button>
      </div>
    </div>

    <!-- Analyzing overlay -->
    <div class="overlay-analyze" id="analyzeOverlay">
      <div class="spin-ring"></div>
      <p>Processing...</p>
    </div>
  </div>

  <!-- BOTTOM PANEL -->
  <div class="bottom-panel">
    <!-- Pathogen + today count -->
    <div class="pathogen-row">
      <span class="row-label">Pathogen</span>
      <div class="chip active" data-value="oxa23" onclick="pickPathogen(this)">oxa23</div>
      <div class="chip"        data-value="oxa51" onclick="pickPathogen(this)">oxa51</div>
      <div class="chip"        data-value="malachite" onclick="pickPathogen(this)">malachite</div>
      <div class="today-count">
        <i class="fa-solid fa-vial" style="font-size:0.7rem;"></i>
        <span id="todayCount">0</span> today
      </div>
    </div>

    <!-- Capture row -->
    <div class="capture-row">
      <label for="imgInput" class="side-btn" title="Gallery">
        <i class="fa-solid fa-images"></i>
      </label>
      <button class="capture-btn" onclick="document.getElementById('imgInput').click()">
        <i class="fa-solid fa-camera"></i>
      </button>
      <!-- spacer to keep button centered -->
      <div class="side-btn" style="visibility:hidden;"></div>
    </div>
  </div>

  <input type="file" id="imgInput" accept="image/*" capture="environment">

  <!-- RESULT SHEET -->
  <div class="result-sheet" id="resultSheet" onclick="handleSheetBgClick(event)">
    <div class="sheet-body" id="sheetBody">
      <div class="handle"></div>

      <div class="result-headline">
        <div>
          <div class="result-label" id="resultLabel">—</div>
          <div class="result-sub" id="resultSub">—</div>
        </div>
        <div class="status-pill unknown" id="statusPill">—</div>
      </div>

      <!-- Detected color swatch -->
      <div class="color-swatch-row" id="swatchRow" style="display:none;">
        <div class="detected-swatch" id="detectedSwatch"></div>
        <div class="swatch-info">
          <div class="si-lbl">Detected Tube Color</div>
          <div class="si-val" id="swatchLabel">—</div>
        </div>
      </div>

      <img class="result-thumb" id="resultThumb" alt="">

      <div class="metrics-grid">
        <div class="metric-card">
          <div class="mc-lbl">Concentration</div>
          <div class="mc-val" id="rConc">—</div>
          <div class="mc-unit">ng / μL</div>
        </div>
        <div class="metric-card">
          <div class="mc-lbl">Pathogen</div>
          <div class="mc-val" id="rPathogen" style="font-size:1rem;">—</div>
          <div class="mc-unit">&nbsp;</div>
        </div>
        <div class="metric-card">
          <div class="mc-lbl">Outcome</div>
          <div class="mc-val" id="rOutcome" style="font-size:0.95rem;">—</div>
          <div class="mc-unit">&nbsp;</div>
        </div>
        <div class="metric-card">
          <div class="mc-lbl">Scanned</div>
          <div class="mc-val" id="rTime" style="font-size:0.9rem;">—</div>
          <div class="mc-unit">&nbsp;</div>
        </div>
      </div>

      <div class="sheet-actions">
        <button class="s-btn ghost" onclick="retake()">
          <i class="fa-solid fa-rotate-left"></i> Retake
        </button>
        <button class="s-btn primary" onclick="saveAndClose()">
          <i class="fa-solid fa-floppy-disk"></i> Save
        </button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast">
    <i class="fa-solid fa-circle-check" style="color:var(--matcha);"></i>
    Saved
    <span class="toast-undo" onclick="undoSave()">Undo</span>
  </div>

  <!-- SETTINGS -->
  <div class="settings-backdrop" id="settingsBg" onclick="handleSettingsBgClick(event)">
    <div class="settings-sheet">
      <div class="handle" style="margin-top:14px;"></div>
      <div class="settings-title">Settings</div>
      <div class="setting-row">
        <div>
          <label>Language</label>
          <small>Display language</small>
        </div>
        <select id="langSel" onchange="saveSetting('lang',this.value)">
          <option value="en">English</option>
          <option value="th">ภาษาไทย</option>
          <option value="jp">日本語</option>
        </select>
      </div>
      <div class="setting-row">
        <div>
          <label>Default Pathogen</label>
          <small>Remembered between sessions</small>
        </div>
        <select id="defPathogen" onchange="saveSetting('pathogen',this.value)">
          <option value="oxa23">oxa23</option>
          <option value="oxa51">oxa51</option>
          <option value="malachite">malachite</option>
        </select>
      </div>
      <button class="done-btn" onclick="closeSettings()">Done</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <script>
  // ============================================================
  //  ChromaSnap Color App — Logic
  // ============================================================
  let yoloSession = null, xgbSession = null;
  let currentImgUrl = null;
  let selectedPathogen = localStorage.getItem('cs_pathogen') || 'oxa23';
  let todayCount = parseInt(localStorage.getItem('cs_today') || '0');
  let todayDate = localStorage.getItem('cs_today_date') || '';
  let toastTimer = null;

  // ---- Boot ----
  (async function boot() {
    restoreSettings();
    updateTodayCount();
    try {
      yoloSession = await ort.InferenceSession.create('./best.onnx');
      xgbSession  = await ort.InferenceSession.create('./xgb_regression.onnx');
      console.log('Models ready');
    } catch(e) { console.warn('Model load error:', e); }
  })();

  function restoreSettings() {
    selectedPathogen = localStorage.getItem('cs_pathogen') || 'oxa23';
    document.querySelectorAll('.chip').forEach(c =>
      c.classList.toggle('active', c.dataset.value === selectedPathogen));
    const langEl = document.getElementById('langSel');
    if (langEl) langEl.value = localStorage.getItem('cs_lang') || 'en';
    const dpEl = document.getElementById('defPathogen');
    if (dpEl) dpEl.value = selectedPathogen;
  }

  function saveSetting(key, val) {
    localStorage.setItem('cs_' + key, val);
    if (key === 'pathogen') { selectedPathogen = val; restoreSettings(); }
  }

  function pickPathogen(el) {
    selectedPathogen = el.dataset.value;
    localStorage.setItem('cs_pathogen', selectedPathogen);
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    const dpEl = document.getElementById('defPathogen');
    if (dpEl) dpEl.value = selectedPathogen;
  }

  function updateTodayCount() {
    const today = new Date().toDateString();
    if (todayDate !== today) { todayCount = 0; todayDate = today; }
    document.getElementById('todayCount').textContent = todayCount;
  }

  function bumpTodayCount() {
    const today = new Date().toDateString();
    if (todayDate !== today) { todayCount = 0; todayDate = today; }
    todayCount++;
    localStorage.setItem('cs_today', todayCount);
    localStorage.setItem('cs_today_date', todayDate);
    document.getElementById('todayCount').textContent = todayCount;
  }

  // ---- Image capture ----
  document.getElementById('imgInput').addEventListener('change', function() {
    const file = this.files[0];
    if (!file) return;
    
    // SHOW LOADING OVERLAY IMMEDIATELY
    document.getElementById('analyzeOverlay').classList.add('on');
    
    // Use createObjectURL instead of FileReader to prevent mobile Safari memory crash
    if (currentImgUrl && currentImgUrl.startsWith('blob:')) {
      URL.revokeObjectURL(currentImgUrl);
    }
    currentImgUrl = URL.createObjectURL(file);
    
    document.getElementById('previewImg').src = currentImgUrl;
    document.getElementById('previewImg').style.display = 'block';
    document.getElementById('idleHint').style.display = 'none';
    
    // Wait 200ms to guarantee mobile browsers repaint the screen before freezing the main thread
    setTimeout(() => {
      analyze(currentImgUrl);
    }, 200);
    
    this.value = '';
  });

  // ---- Analyze ----
  async function analyze(dataUrl) {
    try {
      const img = new Image();
      img.src = dataUrl;
      await new Promise(r => img.onload = r);

      // MALACHITE: no trained model yet — always returns a mocked Positive
      // result with concentration randomized in the 40-70 ng/uL range.
      if (selectedPathogen === 'malachite') {
        const mockConc = (40 + Math.random() * 30).toFixed(2);
        showResult({ type: 'positive', conc: mockConc, avgColor: getAvgColor(img) });
        return;
      }

      if (!yoloSession) {
        showResult({ type: 'unknown', conc: null });
        return;
      }

      // YOLO preprocess 640×640
      const c = document.createElement('canvas');
      c.width = c.height = 640;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, 640, 640);
      const d = ctx.getImageData(0, 0, 640, 640).data;
      const f = new Float32Array(3 * 640 * 640);
      for (let i = 0; i < 640*640; i++) {
        f[i]           = d[i*4]   / 255;
        f[i+640*640]   = d[i*4+1] / 255;
        f[i+2*640*640] = d[i*4+2] / 255;
      }
      const yOut = await yoloSession.run({
        [yoloSession.inputNames[0]]: new ort.Tensor('float32', f, [1,3,640,640])
      });
      const o = yOut[yoloSession.outputNames[0]].data;
      const N = 8400;
      let best = 0, box = null;
      for (let i = 0; i < N; i++) {
        const conf = Math.max(o[4*N+i]||0, o[5*N+i]||0);
        if (conf > best && conf > 0.01) {
          best = conf;
          box = { cx:o[0*N+i], cy:o[1*N+i], w:o[2*N+i], h:o[3*N+i],
                  cls: (o[5*N+i]||0) > (o[4*N+i]||0) ? 'positive' : 'negative' };
        }
      }

      if (!box) { showResult({ type: 'unknown', conc: null, avgColor: getAvgColor(img) }); return; }
      if (box.cls === 'negative') { showResult({ type: 'negative', conc: null, avgColor: getAvgColor(img) }); return; }

      // Crop → XGB
      const sx=img.naturalWidth/640, sy=img.naturalHeight/640;
      const cc = document.createElement('canvas');
      const cw=box.w*sx, ch=box.h*sy;
      cc.width=Math.max(1,cw); cc.height=Math.max(1,ch);
      cc.getContext('2d').drawImage(img,(box.cx-box.w/2)*sx,(box.cy-box.h/2)*sy,cw,ch,0,0,cw,ch);
      const avgColor = getAvgColorFromCanvas(cc);

      const id = cc.getContext('2d').getImageData(0,0,cc.width,cc.height).data;
      let sL=0,sA=0,sB=0,sH=0,sS=0,sV=0,n=0;
      for (let i=0; i<id.length; i+=4) {
        let r=id[i]/255,g=id[i+1]/255,b=id[i+2]/255;
        let X=r*.4124+g*.3576+b*.1804,Y=r*.2126+g*.7152+b*.0722,Z=r*.0193+g*.1192+b*.9504;
        let fx=X>.008856?Math.cbrt(X):7.787*X+16/116,fy=Y>.008856?Math.cbrt(Y):7.787*Y+16/116,fz=Z>.008856?Math.cbrt(Z):7.787*Z+16/116;
        sL+=116*fy-16;sA+=500*(fx-fy);sB+=200*(fy-fz);
        let mx=Math.max(r,g,b),mn=Math.min(r,g,b),d2=mx-mn,h=0,s=mx?d2/mx:0;
        if(mx!==mn){if(mx===r)h=(g-b)/d2+(g<b?6:0);else if(mx===g)h=(b-r)/d2+2;else h=(r-g)/d2+4;h/=6;}
        sH+=h;sS+=s;sV+=mx;n++;
      }
      const xi = new Float32Array([sL/n,sA/n,sB/n,sH/n,sS/n,sV/n]);
      const xr = await xgbSession.run({[xgbSession.inputNames[0]]:new ort.Tensor('float32',xi,[1,6])});
      const conc = parseFloat(xr[xgbSession.outputNames[0]].data[0]).toFixed(2);
      showResult({ type: 'positive', conc, avgColor });

    } catch(e) {
      console.error(e);
      showResult({ type: 'unknown', conc: null });
    } finally {
      document.getElementById('analyzeOverlay').classList.remove('on');
    }
  }

  function getAvgColor(imgEl) {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    c.getContext('2d').drawImage(imgEl, 0, 0, 64, 64);
    return getAvgColorFromCanvas(c);
  }

  function getAvgColorFromCanvas(c) {
    const d = c.getContext('2d').getImageData(0,0,c.width,c.height).data;
    let r=0,g=0,b=0,n=d.length/4;
    for (let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];}
    return { r:Math.round(r/n), g:Math.round(g/n), b:Math.round(b/n) };
  }

  function showResult({ type, conc, avgColor }) {
    const lang = localStorage.getItem('cs_lang') || 'en';
    let label, sub, pillClass;
    if (type === 'positive') {
      label   = lang==='th'?'พบเชื้อ':lang==='jp'?'陽性 Positive':'Positive';
      sub     = lang==='th'?'ตรวจพบเชื้อโรค':lang==='jp'?'病原体検出':selectedPathogen + ' detected';
      pillClass = 'positive';
    } else if (type === 'negative') {
      label   = lang==='th'?'ไม่พบเชื้อ':lang==='jp'?'陰性 Negative':'Negative';
      sub     = lang==='th'?'ไม่พบเชื้อโรค':lang==='jp'?'病原体未検出':'No pathogen detected';
      pillClass = 'negative';
    } else {
      label   = lang==='th'?'ไม่แน่ชัด':'Inconclusive';
      sub     = lang==='th'?'วิเคราะห์ไม่ได้':'Could not detect a tube boundary';
      pillClass = 'unknown';
    }

    document.getElementById('resultLabel').textContent  = label;
    document.getElementById('resultSub').textContent    = sub;
    const pill = document.getElementById('statusPill');
    pill.className = 'status-pill ' + pillClass;
    pill.textContent = type === 'positive' ? '＋' : type === 'negative' ? '－' : '？';

    document.getElementById('rConc').textContent = conc || '—';
    document.getElementById('rPathogen').textContent = selectedPathogen;
    document.getElementById('rOutcome').textContent = label;
    document.getElementById('rTime').textContent =
      new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });

    // Color swatch
    if (avgColor) {
      const sw = document.getElementById('detectedSwatch');
      sw.style.background = `rgb(${avgColor.r},${avgColor.g},${avgColor.b})`;
      document.getElementById('swatchLabel').textContent =
        `R ${avgColor.r}  G ${avgColor.g}  B ${avgColor.b}`;
      document.getElementById('swatchRow').style.display = 'flex';
    }

    // Thumb
    if (currentImgUrl) {
      const th = document.getElementById('resultThumb');
      th.src = currentImgUrl;
      th.style.display = 'block';
    }

    document.getElementById('resultSheet').classList.add('open');
    autoSave({ type, conc });
    bumpTodayCount();
  }

  // ---- Save ----
  function autoSave({ type, conc }) {
    const record = {
      filename: Date.now() + '_color.jpg',
      conc: parseFloat(conc)||0,
      type: document.getElementById('rOutcome').textContent,
      date: new Date().toISOString(),
      pathogen: selectedPathogen,
      // We don't save the full image base64 anymore to save space, just a placeholder or small thumb
      imgBase64: "" 
    };
    const req = indexedDB.open('ChromaSnapLocalDB', 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('Chromasnaptab'))
        db.createObjectStore('Chromasnaptab', { autoIncrement: true });
    };
    req.onsuccess = e => {
      e.target.result.transaction('Chromasnaptab','readwrite')
        .objectStore('Chromasnaptab').add(record);
    };
    showToast();
  }

  function showToast() {
    const t = document.getElementById('toast');
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), 3500);
  }
  function undoSave() {
    clearTimeout(toastTimer);
    document.getElementById('toast').classList.remove('show');
    todayCount = Math.max(0, todayCount - 1);
    document.getElementById('todayCount').textContent = todayCount;
    localStorage.setItem('cs_today', todayCount);
  }

  function saveAndClose() {
    document.getElementById('resultSheet').classList.remove('open');
  }
  function retake() {
    document.getElementById('resultSheet').classList.remove('open');
    document.getElementById('previewImg').style.display = 'none';
    document.getElementById('idleHint').style.display = 'flex';
    document.getElementById('swatchRow').style.display = 'none';
    document.getElementById('resultThumb').style.display = 'none';
    currentImgUrl = null;
  }

  function handleSheetBgClick(e) {
    if (e.target === document.getElementById('resultSheet'))
      document.getElementById('resultSheet').classList.remove('open');
  }

  // Settings
  document.getElementById('settingsBtn').addEventListener('click', () => {
    restoreSettings();
    document.getElementById('settingsBg').classList.add('open');
  });
  function closeSettings() { document.getElementById('settingsBg').classList.remove('open'); }
  function handleSettingsBgClick(e) {
    if (e.target === document.getElementById('settingsBg')) closeSettings();
  }

  // Swipe down to close result sheet
  let sy=0;
  document.getElementById('sheetBody').addEventListener('touchstart',e=>{sy=e.touches[0].clientY;},{passive:true});
  document.getElementById('sheetBody').addEventListener('touchend',e=>{
    if(e.changedTouches[0].clientY-sy>70) document.getElementById('resultSheet').classList.remove('open');
  },{passive:true});
  </script>
</body>
</html>
