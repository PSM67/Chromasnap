<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>ChromaSnap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Quicksand:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A3322">
  <style>
    /* ===================================================
       ChromaSnap — same design system as app_strip.html
       Warm oat tones, dark viewfinder accent
    =================================================== */
    :root {
      --bg:          #F5EFE6;
      --bg-dark:     #1C1410;
      --surface:     #FDFAF5;
      --surface-2:   #EDE6DA;
      --wood:        #8B6245;
      --wood-deep:   #4A3322;
      --amber:       #C9924F;
      --amber-soft:  rgba(201,146,79,0.14);
      --sakura:      #C09098;
      --sakura-soft: rgba(192,144,152,0.14);
      --matcha:      #7A9B82;
      --positive:    #C95A72;
      --negative:    #5A8A62;
      --text:        #2E2118;
      --text-2:      #7A6A5A;
      --text-3:      #A99888;
      --border:      rgba(139,98,69,0.12);
      --safe-top:    env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%; height: 100dvh;
      overflow: hidden;
    }
    body {
      font-family: 'Quicksand', 'Sarabun', sans-serif;
      color: var(--text);
      background: var(--bg-dark);
      transition: background 0.7s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    body.ready { background: var(--bg); }

    /* ============ SPLASH ============ */
    .splash {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-dark);
      opacity: 1;
      transition: opacity 0.7s ease;
    }
    .splash.hide { opacity: 0; pointer-events: none; }

    .splash img {
      width: 42vw;
      max-width: 190px;
      opacity: 0;
      transform: scale(0.85);
      animation: logoFlash 2.1s ease forwards;
      filter: drop-shadow(0 10px 34px rgba(0,0,0,0.45));
    }
    @keyframes logoFlash {
      0%   { opacity: 0;    transform: scale(0.85); }
      30%  { opacity: 1;    transform: scale(1); }
      50%  { opacity: 0.5;  transform: scale(1); }
      70%  { opacity: 1;    transform: scale(1); }
      100% { opacity: 1;    transform: scale(1); }
    }

    /* ============ MAIN VIEW ============ */
    .main-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 24px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .main-view.show { opacity: 1; transform: translateY(0); }

    .logo-badge {
      width: 132px; height: 132px;
      border-radius: 32px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(46,33,24,0.16);
      display: flex; align-items: center; justify-content: center;
    }
    .logo-badge img {
      width: 100%; height: 100%;
      object-fit: contain;
    }

    .lang-row { display: flex; gap: 8px; }
    .lang-btn {
      padding: 7px 18px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all 0.18s;
    }
    .lang-btn.active {
      background: var(--wood-deep);
      border-color: var(--wood-deep);
      color: rgba(245,230,200,0.95);
    }
    .lang-btn:active { opacity: 0.75; }

    .start-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--wood-deep);
      color: rgba(245,230,200,0.95);
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.92rem;
      letter-spacing: 0.12em;
      text-decoration: none;
      padding: 16px 42px;
      border-radius: 50px;
      box-shadow: 0 4px 18px rgba(46,33,24,0.22);
      transition: transform 0.14s, box-shadow 0.14s;
    }
    .start-btn:active { transform: scale(0.96); box-shadow: 0 2px 8px rgba(46,33,24,0.16); }
  </style>
</head>
<body>

  <div class="splash" id="splash">
    <img src="logo-icon.png" alt="ChromaSnap">
  </div>

  <div class="main-view" id="mainView">
    <div class="logo-badge">
      <img src="logo-icon.png" alt="ChromaSnap">
    </div>

    <div class="lang-row">
      <button class="lang-btn active" data-lang="en" onclick="setLang('en',this)">EN</button>
      <button class="lang-btn" data-lang="th" onclick="setLang('th',this)">TH</button>
      <button class="lang-btn" data-lang="jp" onclick="setLang('jp',this)">JP</button>
    </div>

    <a href="homepage.html" class="start-btn">
      <i class="fa-solid fa-circle-play"></i> <span data-i18n="start_btn">START</span>
    </a>
  </div>

  <script src="translations.js"></script>
  <script>
    let currentLang = localStorage.getItem('cs_lang') || 'en';
    function T(key) {
      const dict = window.translations || {};
      return (dict[currentLang] && dict[currentLang][key])
          || (dict.en && dict.en[key])
          || key;
    }
    function applyI18n() {
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
      document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = T(el.dataset.i18nHtml); });
    }

    function applyLangUI(lang) {
      document.querySelectorAll('.lang-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.lang === lang));
    }
    function setLang(lang, el) {
      currentLang = lang;
      localStorage.setItem('cs_lang', lang);
      applyLangUI(lang);
      applyI18n();
    }
    applyLangUI(currentLang);
    applyI18n();

    // Splash: logo fades/pulses in, fully fades out, THEN the start screen fades in.
    // (Sequenced rather than crossfaded — the two logos differ in size/position,
    // so overlapping them mid-transition looked like a double-exposed ghost.)
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('splash').classList.add('hide');
        document.body.classList.add('ready');
        setTimeout(() => {
          document.getElementById('mainView').classList.add('show');
        }, 700);
      }, 2100);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
